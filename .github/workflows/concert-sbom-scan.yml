name: Full DevSecOps Pipeline with IBM Concert

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CONCERT_TOOLKIT_VERSION: v2.1.0

jobs:
  devsecops:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      security-events: write
      id-token: write

    steps:
      #################################################
      # Checkout
      #################################################
      - name: Checkout
        uses: actions/checkout@v4

      #################################################
      # Set Image Name (lowercase)
      #################################################
      - name: Set Image Name
        id: image
        run: |
          # Convert repository name to lowercase for Docker compatibility
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_LOWER}/concert-demo"
          IMAGE_TAG="${{ github.sha }}"
          
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          
          echo "Image will be: ${IMAGE_NAME}:${IMAGE_TAG}"

      #################################################
      # Docker Login
      #################################################
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      #################################################
      # Build Image
      #################################################
      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG .
          echo "Built image: $IMAGE_NAME:$IMAGE_TAG"

      #################################################
      # Install Syft
      #################################################
      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft version

      #################################################
      # Generate SBOM
      #################################################
      - name: Generate CycloneDX SBOM
        run: |
          syft $IMAGE_NAME:$IMAGE_TAG -o cyclonedx-json > concert-demo-sbom.json
          echo "Generated SBOM:"
          ls -lh concert-demo-sbom.json

      #################################################
      # Install Grype
      #################################################
      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype version

      #################################################
      # Vulnerability Scan
      #################################################
      - name: Scan CVEs
        run: |
          grype sbom:concert-demo-sbom.json -o json --file grype-report.json
          grype sbom:concert-demo-sbom.json -o table
          # Uncomment to fail on high severity vulnerabilities
          # grype sbom:concert-demo-sbom.json --fail-on high

      #################################################
      # Push Image
      #################################################
      - name: Push Image
        run: |
          docker push $IMAGE_NAME:$IMAGE_TAG
          echo "Pushed image: $IMAGE_NAME:$IMAGE_TAG"

      #################################################
      # Install Cosign
      #################################################
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      #################################################
      # Sign Image
      #################################################
      - name: Sign Image
        run: |
          cosign sign --yes $IMAGE_NAME:$IMAGE_TAG
          echo "Signed image: $IMAGE_NAME:$IMAGE_TAG"

      #################################################
      # Pull IBM Concert Toolkit
      #################################################
      - name: Pull Concert Toolkit
        run: |
          docker pull icr.io/cpopen/ibm-concert-toolkit:$CONCERT_TOOLKIT_VERSION
          echo "Pulled IBM Concert Toolkit: $CONCERT_TOOLKIT_VERSION"

      #################################################
      # Prepare Toolkit Data
      #################################################
      - name: Prepare Toolkit Directory
        run: |
          mkdir -p toolkit-data
          cp concert-demo-sbom.json toolkit-data/
          
          # Substitute environment variables in config files
          envsubst < concert/build-config.yaml > toolkit-data/build-config.yaml
          envsubst < concert/deploy-config.yaml > toolkit-data/deploy-config.yaml
          
          echo "Toolkit data prepared:"
          ls -lh toolkit-data/

      #################################################
      # Generate Build SBOM
      #################################################
      - name: Generate Build SBOM
        run: |
          docker run --rm \
            -v $(pwd)/toolkit-data:/toolkit-data \
            icr.io/cpopen/ibm-concert-toolkit:$CONCERT_TOOLKIT_VERSION \
            /bin/bash -c \
            "build-sbom --build-config /toolkit-data/build-config.yaml"
          
          echo "Build SBOM generated:"
          ls -lh toolkit-data/*.json

      #################################################
      # Generate Deploy SBOM
      #################################################
      - name: Generate Deploy SBOM
        run: |
          docker run --rm \
            -v $(pwd)/toolkit-data:/toolkit-data \
            icr.io/cpopen/ibm-concert-toolkit:$CONCERT_TOOLKIT_VERSION \
            /bin/bash -c \
            "deploy-sbom --deploy-config /toolkit-data/deploy-config.yaml"
          
          echo "Deploy SBOM generated:"
          ls -lh toolkit-data/*.json

      #################################################
      # Upload Artifacts
      #################################################
      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: concert-sboms
          path: |
            toolkit-data/*.json
            concert-demo-sbom.json
            grype-report.json
          retention-days: 30

      #################################################
      # Generate Summary
      #################################################
      - name: Generate Pipeline Summary
        if: always()
        run: |
          echo "## DevSecOps Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** $IMAGE_NAME:$IMAGE_TAG" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generated Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- CycloneDX SBOM" >> $GITHUB_STEP_SUMMARY
          echo "- Grype Vulnerability Report" >> $GITHUB_STEP_SUMMARY
          echo "- IBM Concert Build SBOM" >> $GITHUB_STEP_SUMMARY
          echo "- IBM Concert Deploy SBOM" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security Checks" >> $GITHUB_STEP_SUMMARY
          echo "✅ Image built and scanned" >> $GITHUB_STEP_SUMMARY
          echo "✅ Image signed with Cosign" >> $GITHUB_STEP_SUMMARY
          echo "✅ SBOMs generated for Concert" >> $GITHUB_STEP_SUMMARY

# Made with Bob
